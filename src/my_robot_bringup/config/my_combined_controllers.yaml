controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    my_arm_controller:
      type: my_controller/MyController

    pid_arm_controller:
      type: pid_controller/PidController
    
    my_pid_controller:
      type: my_robot_pid_controller/PidController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]

    wheel_separation: 0.45
    wheel_radius: 0.1

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true
    publish_rate: 50.0

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

arm_controller:
  ros__parameters:

    joints:
      - arm_base_forearm_joint
      - forearm_hand_joint

    # 输出关节速度
    command_interfaces:
      - velocity

    # 读取关节位置和速度
    state_interfaces:
      - position
      - velocity

    # PID 参数
    gains:
      arm_base_forearm_joint:
        p: 10.0
        i: 0.2
        d: 0.05
        i_clamp: 0.3
        ff_velocity_scale: 1.0

      forearm_hand_joint:
        p: 10.0
        i: 0.2
        d: 0.05
        i_clamp: 0.3
        ff_velocity_scale: 1.0

my_arm_controller:
  ros__parameters:
    joints: ["arm_base_forearm_joint", "forearm_hand_joint"]
    interface_name: "position"
    coefficient: 0.05

pid_arm_controller:
  ros__parameters:

    # 要控制的两个关节
    dof_names:
      - arm_base_forearm_joint
      - forearm_hand_joint

    # 读取关节位置，与目标位置比较
    reference_and_state_interfaces:
      - position

    # PID 计算结果作为速度命令输出
    command_interface: velocity

    # 每个关节各有一组增益
    gains:
      arm_base_forearm_joint:
        p: 0.5
        i: 0.2
        d: 0.05
        i_clamp_max: 0.3
        i_clamp_min: -0.3

      forearm_hand_joint:
        p: 0.5
        i: 0.2
        d: 0.05
        i_clamp_max: 0.3
        i_clamp_min: -0.3

my_pid_controller:
  ros__parameters:
    joints:
      - arm_base_forearm_joint
      - forearm_hand_joint

    state_interface: "position"
    command_interface: "velocity"

    kp: 100.0
    kd: 5.0
    max_velocity: 0.3